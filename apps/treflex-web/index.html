<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="theme-color" content="#fcfcfc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <!-- Paints the stored scheme before the app loads. colorScheme.test.ts keeps it in step with colorScheme.ts and preferences.ts. -->
    <script>
      (() => {
        let mode = null;
        try {
          mode = localStorage.getItem("t3code:theme-appearance-mode");
        } catch {}
        const dark =
          mode === "dark" ||
          (mode !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        if (mode === "light" || mode === "dark")
          for (const meta of document.querySelectorAll('meta[name="theme-color"]'))
            meta.content = dark ? "#000000" : "#fcfcfc";
      })();
    </script>
    <style>
      html {
        color-scheme: light;
        background: #fcfcfc;
      }
      html[data-theme="dark"] {
        color-scheme: dark;
        background: #000000;
      }
    </style>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>T3 Code (Treflex)</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="T3 Code" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
